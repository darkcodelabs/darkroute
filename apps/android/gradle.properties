org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The host the app is trusted against. Changing it means re-hosting
# .well-known/assetlinks.json on the new host FIRST — an app whose Digital
# Asset Link does not resolve does not fail to launch, it launches with a
# Chrome address bar across the top, which is worse because it looks like it
# worked. See README.md#switching-to-the-apex-domain.
fwm.host=darkroute.ai
fwm.startPath=/?src=twa
