name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# WHAT THIS CHECKS, AND WHY IT NOW CHECKS THE CODE.
#
# This file sat as the untouched project template long after the repo filled
# with application code -- its own comment said "when you add source code,
# replace or extend these jobs with your real build/test/lint pipeline", and
# nobody did. The consequence was that CI ran markdownlint, yamllint and
# actionlint and NOTHING ELSE: a regression merged to main with three green
# checkmarks, and every real check was one a human chose to run locally.
#
# That was not theoretical. Shipped on green: `pnpm lint` failing, three
# scripts/*.test.mjs files that no command invoked, and a map that drew no
# camera markers at all.

jobs:
  # THE REAL PIPELINE. Everything below it is docs hygiene.
  code:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `lint` also runs the design-token gate, the citation checks and the
      # basemap-asset guard -- see package.json.
      - run: pnpm lint

      - run: pnpm typecheck

      # Covers apps/pwa, packages/core AND scripts/. The scripts tests existed
      # for months while `pnpm test` invoked none of them.
      - run: pnpm test

      - run: pnpm build

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            # VENDORED DESIGN SOURCE, not our prose. `.design-src*/` holds the
            # exported design files and their upload notes verbatim -- they are
            # the input this app was built FROM, and reformatting them to
            # satisfy a linter would make them stop matching what was handed
            # over. They are read, never edited.
            !.design-src*/**

  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.7
      - name: Install checksum-pinned yamllint
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/yamllint-requirements.txt" <<'EOF'
          yamllint==1.38.0 --hash=sha256:fc394a5b3be980a4062607b8fdddc0843f4fa394152b6da21722f5d59013c220
          pathspec==0.12.1 --hash=sha256:a0d503e138a4c123b27490a4f7beda6a01c6f288df0e4a8b79c7eb0dc7b4cc08
          PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6
          EOF
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            --requirement "$RUNNER_TEMP/yamllint-requirements.txt"
          yamllint --version
      - name: yamllint
        run: |
          cat > "$RUNNER_TEMP/yamllint.yml" <<'EOF'
          extends: relaxed
          rules:
            line-length: disable
            truthy: disable
            document-start: disable
          EOF
          # Hand-authored YAML that ships in the public tree. Generated and
          # local-tool configuration files are intentionally outside this set.
          yamllint --config-file "$RUNNER_TEMP/yamllint.yml" \
            .github CITATION.cff pnpm-workspace.yaml

  actions:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color
